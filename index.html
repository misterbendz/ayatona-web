  <body>
    <div id="splash" role="status" aria-live="polite" aria-label="جارٍ تحميل آياتنا">
      <div class="lattice"></div>
      <div class="vignette"></div>
      <div class="content">
        <div class="emblem">
          <div class="halo"></div>
          <div class="ring a"></div>
          <div class="ring b"></div>
          <img src="/icon.png" alt="" />
        </div>
        <h1>آياتنا</h1>
        <div class="tagline">صانع فيديوهات القرآن الكريم</div>
        <div class="divider"><i></i><b></b><i></i></div>
        <div class="progress">
          <div class="track"><div class="fill"></div></div>
          <div class="status"><span class="label">جارٍ التهيئة…</span><b class="pct">٠٪</b></div>
        </div>
      </div>
      <div class="credit">تصميم وبرمجة <span>بن ذهيبة قوعيش</span> · الإصدار 1.2.1</div>
    </div>
    <script>
      // Progress of the welcome screen. The bar eases toward the target set by each real
      // loading step (window.__splash.set), and creeps forward slowly while a step runs.
      (function () {
        var el = document.getElementById('splash');
        var fill = el.querySelector('.fill');
        var pct = el.querySelector('.pct');
        var label = el.querySelector('.label');
        var started = performance.now();
        var target = 0.12;
        var ceiling = 0.32; // how far the bar may creep before the next real step
        var shown = 0;
        var finishing = false;
        var digits = '٠١٢٣٤٥٦٧٨٩';
        function arabic(n) {
          return String(n).replace(/\d/g, function (d) {
            return digits[d];
          });
        }
        function frame() {
          if (!finishing && target < ceiling) target += (ceiling - target) * 0.004;
          shown += (target - shown) * (finishing ? 0.12 : 0.06);
          if (target - shown < 0.0015) shown = target;
          fill.style.width = (shown * 100).toFixed(2) + '%';
          pct.textContent = arabic(Math.round(shown * 100)) + '٪';
          if (finishing && shown >= 0.999) return leave();
          next();
        }
        // Animation frames pause while the window is in the background (minimised, or a tab
        // opened behind another); a timer keeps the bar moving there.
        function next() {
          if (document.hidden) setTimeout(frame, 50);
          else requestAnimationFrame(frame);
        }
        function leave() {
          // let the full bar register for a moment, and keep the screen at least ~2 s
          var wait = Math.max(250, 2000 - (performance.now() - started));
          setTimeout(function () {
            el.classList.add('leaving');
            setTimeout(function () {
              el.remove();
            }, 950);
          }, wait);
        }
        window.__splash = {
          /** a real loading step reached `value` (0..1); the bar may creep up to `next` meanwhile */
          set: function (value, text, next) {
            target = Math.max(target, value);
            ceiling = Math.max(target, next || value + 0.12);
            if (text) label.textContent = text;
          },
          done: function () {
            if (finishing) return;
            finishing = true;
            target = 1;
            label.textContent = 'مرحبًا بك';
          },
        };
        next();
        // never keep the app hidden: give up after 15 s whatever happens
        setTimeout(function () {
          window.__splash.done();
        }, 15000);
      })();
    </script>
