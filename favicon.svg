<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#16264a"/>
      <stop offset="0.55" stop-color="#0b1326"/>
      <stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#e3c78f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e3c78f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fbeec9"/>
      <stop offset="0.45" stop-color="#e3c78f"/>
      <stop offset="1" stop-color="#a87c35"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14213f"/>
      <stop offset="1" stop-color="#080d1b"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#glow)"/>
  <rect x="44" y="44" width="936" height="936" rx="204" fill="none" stroke="#e3c78f" stroke-opacity="0.28" stroke-width="6"/>

  <!-- eight-pointed star (rub el hizb): two interlaced squares -->
  <g fill="none" stroke="url(#gold)" stroke-width="40" stroke-linejoin="round">
    <rect x="252" y="252" width="520" height="520" rx="26"/>
    <rect x="252" y="252" width="520" height="520" rx="26" transform="rotate(45 512 512)"/>
  </g>

  <!-- centre disc with play mark: verses set in motion -->
  <circle cx="512" cy="512" r="196" fill="url(#disc)" stroke="url(#gold)" stroke-width="22"/>
  <path d="M462 408 L462 616 Q462 640 484 628 L650 530 Q670 512 650 494 L484 396 Q462 384 462 408 Z" fill="url(#gold)"/>
</svg>
